[alembic]
script_location = migrations
prepend_sys_path = .

# No "timezone" setting on purpose. It only stamps generated revision files,
# alembic resolves it through zoneinfo -- which needs the tzdata package on
# Windows -- and it made "alembic revision" fail outright. This repository
# hand-writes its migrations with fixed rev-ids and ships no script.py.mako,
# so revision generation cannot run here regardless.

# The runtime URL is read from DATABASE_URL via app.config.Settings in migrations/env.py.
sqlalchemy.url = sqlite+aiosqlite:///./data/chat_audit.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
