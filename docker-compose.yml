services:
  app:
    # 默认从当前目录的 Dockerfile 构建镜像。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-audit-core
    restart: unless-stopped

    # 这里只保留容器部署必须覆盖，或通常需要由管理员配置的项目。
    # 其余参数已在 app/config.py 中提供默认值，无需在 Compose 中重复维护。
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYSTEM_INSTANCE_ID: ${SYSTEM_INSTANCE_ID}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_API_TOKENS: ${ADMIN_API_TOKENS:-}

      # 默认使用独立数据库目录中的 SQLite；叠加 PostgreSQL 配置时会覆盖此项。
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/database/chat_audit.sqlite3}

      # 容器内数据目录必须与下面的 /app/data 挂载保持一致。
      STORAGE_ROOT: /app/data/storage
      BACKUP_ROOT: /app/data/backups

      # NapCat / OneBot 连接凭据。
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN}

      # 仅在启用 FFmpeg 转码或使用宿主机 FFmpeg 时需要调整。
      FFMPEG_LIBRARY_PATH: ${FFMPEG_LIBRARY_PATH:-}
      MEDIA_TRANSCODE_ENABLED: ${MEDIA_TRANSCODE_ENABLED:-false}

    ports:
      - "8000:8000"

    # 数据库、聊天媒体和备份可分别挂载到不同磁盘或 NAS 共享目录。
    # 不填写路径变量时，仍会保存在项目目录的 data 子目录中。
    volumes:
      - ${DATABASE_DATA_PATH:-./data/database}:/app/data/database
      - ${MEDIA_STORAGE_PATH:-./data/storage}:/app/data/storage
      - ${BACKUP_STORAGE_PATH:-./data/backups}:/app/data/backups

    # 外部网络用于与现有 NapCat/AstrBot 容器通信，必须提前存在。
    networks:
      - default
      - qqbot_astrbot_network

    # 使用 Python 标准库检查应用健康状态，不依赖 curl 等额外工具。
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); sys.exit(0 if r.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  # Docker 不会自动创建 external 网络；名称必须与 NAS 上现有网络一致。
  qqbot_astrbot_network:
    external: true
